# ACA Safety Net Configuration
# Copy to ~/.config/aca-safety-net/config.toml
#
# Every protection is on by default; this file only needs what you change.
# Note: TOML single-quoted strings are literal - use single backslash for regex

# Extra sensitive file patterns, added to the enabled built-in groups.
# Don't copy built-in patterns here: a copy stays blocked even after you
# disable its group.
sensitive_files = []

# Built-in sensitive file groups. All default to true.
#   env_files   .env, .env.*, .envrc
#   direnv      .direnv/, direnvrc, ~/.config/direnv/
#   mise        .mise*, mise.toml, ~/.config/mise/
#   shadowenv   .shadowenv.d/
#   credentials credentials, secrets, .netrc, .npmrc, .pypirc, .git-credentials
#   keys        .pem, .key, id_rsa, id_ed25519, id_ecdsa
#   cloud       .kube/config, kubeconfig, .aws/credentials, gcloud, gh hosts
#   history     *_history, .bash_history, .zsh_history
# [sensitive_groups]
# env_files = false

# Env-loading tools (direnv, mise, shadowenv) are blocked by default.
# Disable a tool's block, or allow specific subcommands. Subcommands only
# match when written plainly (`mise install`), never quoted or in $(...).
# infisical and env/printenv are always blocked and not configurable.
# [tools.direnv]
# enabled = false
# [tools.mise]
# allow_subcommands = ["install", "use", "ls", "which"]

# Preset for setups where secrets are injected at runtime (e.g.
# `infisical run`) and env files hold none. Turns off the env_files,
# direnv, mise and shadowenv groups and the direnv, mise and shadowenv
# tool blocks. Explicit [sensitive_groups] / [tools] entries override it.
# profile = "secretless"

# Enable paranoid mode (blocks ANY mention of sensitive files)
# [paranoid]
# enabled = true

# Enable audit logging
# [audit]
# enabled = true
# path = "~/.config/aca-safety-net/audit.log"
